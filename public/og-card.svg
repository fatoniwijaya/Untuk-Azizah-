<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020408" />
      <stop offset="60%" stop-color="#060c14" />
      <stop offset="100%" stop-color="#010204" />
    </linearGradient>

    <!-- OLED Cyan Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Neon Pink Glow Filter -->
    <filter id="pinkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Pixel Grid Overlay Background Pattern -->
  <pattern id="pixelGrid" width="16" height="16" patternUnits="userSpaceOnUse">
    <rect width="16" height="16" fill="none" />
    <circle cx="8" cy="8" r="0.75" fill="#00F0FF" opacity="0.08" />
  </pattern>
  <rect width="1200" height="630" fill="url(#pixelGrid)" />

  <!-- Outer OLED Hardware Bezel Border -->
  <rect x="28" y="28" width="1144" height="574" rx="28" fill="none" stroke="#00F0FF" stroke-width="2.5" opacity="0.35" />
  <rect x="36" y="36" width="1128" height="558" rx="20" fill="none" stroke="#00F0FF" stroke-width="1.2" opacity="0.7" filter="url(#cyanGlow)" />

  <!-- Corner Accent Screws/Marks -->
  <circle cx="50" cy="50" r="4" fill="#00F0FF" opacity="0.8" />
  <circle cx="1150" cy="50" r="4" fill="#00F0FF" opacity="0.8" />
  <circle cx="50" cy="580" r="4" fill="#00F0FF" opacity="0.8" />
  <circle cx="1150" cy="580" r="4" fill="#00F0FF" opacity="0.8" />

  <!-- Top Hardware Status Bar -->
  <g transform="translate(64, 68)">
    <rect x="0" y="0" width="1072" height="38" rx="8" fill="#00F0FF" fill-opacity="0.05" stroke="#00F0FF" stroke-opacity="0.2" stroke-width="1" />
    <circle cx="20" cy="19" r="5" fill="#00FF66" filter="url(#cyanGlow)" />
    <text x="36" y="24" font-family="'JetBrains Mono', monospace, 'Courier New'" font-size="14" font-weight="700" fill="#00F0FF" letter-spacing="2">OLED-SSD1306 // 128x64 MONOCHROME RETRO DISPLAY</text>
    <text x="1052" y="24" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="500" fill="#FF4477" letter-spacing="1">12 SCENE LOVE STORY</text>
  </g>

  <!-- City Skyline Silhouette at Bottom -->
  <g fill="#00F0FF" opacity="0.3" transform="translate(64, 430)">
    <!-- Building 1 -->
    <rect x="0" y="20" width="80" height="120" />
    <!-- Building 2 with spires -->
    <rect x="90" y="-30" width="100" height="170" />
    <rect x="135" y="-55" width="10" height="25" />
    <!-- Building 3 -->
    <rect x="200" y="10" width="90" height="130" />
    <!-- Building 4 -->
    <rect x="300" y="-10" width="110" height="150" />
    <!-- Center Gap with Moon -->
    <!-- Building 5 -->
    <rect x="660" y="-20" width="100" height="160" />
    <rect x="705" y="-45" width="10" height="25" />
    <!-- Building 6 -->
    <rect x="770" y="15" width="80" height="125" />
    <!-- Building 7 -->
    <rect x="860" y="-40" width="110" height="180" />
    <!-- Building 8 -->
    <rect x="980" y="10" width="92" height="130" />
    <!-- Ground line -->
    <rect x="0" y="138" width="1072" height="6" fill="#00F0FF" opacity="0.8" />
  </g>

  <!-- Big Glowing Pixel Heart in Center -->
  <g transform="translate(600, 240) scale(4)" filter="url(#pinkGlow)">
    <!-- Pixel Heart coordinate matrix (-9 to +9) -->
    <g fill="#FF2E63">
      <!-- Row -5 -->
      <rect x="-6" y="-6" width="4" height="2" />
      <rect x="2" y="-6" width="4" height="2" />
      <!-- Row -4 -->
      <rect x="-8" y="-4" width="7" height="2" />
      <rect x="1" y="-4" width="7" height="2" />
      <!-- Row -2 -->
      <rect x="-9" y="-2" width="18" height="4" />
      <!-- Row +2 -->
      <rect x="-8" y="2" width="16" height="2" />
      <!-- Row +4 -->
      <rect x="-6" y="4" width="12" height="2" />
      <!-- Row +6 -->
      <rect x="-4" y="6" width="8" height="2" />
      <!-- Row +8 -->
      <rect x="-2" y="8" width="4" height="2" />
    </g>
    <!-- Highlight in heart -->
    <rect x="-6" y="-4" width="2" height="2" fill="#FFFFFF" opacity="0.9" />
  </g>

  <!-- Retro Romance Typography -->
  <!-- Main Title -->
  <text x="600" y="160" text-anchor="middle" font-family="'Cinzel', 'Times New Roman', Georgia, serif" font-size="44" font-weight="700" fill="#FFFFFF" letter-spacing="4">
    Kisah Cinta Retro OLED
  </text>
  
  <text x="600" y="196" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="600" fill="#00F0FF" letter-spacing="6">
    UNTUK SESEORANG YANG SELALU SPESIAL
  </text>

  <!-- Dedication Card Container -->
  <g transform="translate(240, 360)">
    <rect x="0" y="0" width="720" height="96" rx="16" fill="#000000" fill-opacity="0.85" stroke="#00F0FF" stroke-width="2" filter="url(#cyanGlow)" />
    
    <text x="360" y="42" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="700" fill="#00F0FF" letter-spacing="2">
      SPESIAL UNTUK KAMU ❤️
    </text>

    <text x="360" y="74" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="500" fill="#E2E8F0" letter-spacing="0.5">
      Klik untuk menonton animasi pixel art 12 babak dengan musik retro
    </text>
  </g>

  <!-- Stars in the Sky -->
  <g fill="#FFFFFF" opacity="0.85">
    <circle cx="160" cy="180" r="2.5" filter="url(#cyanGlow)" />
    <circle cx="280" cy="130" r="1.5" />
    <circle cx="420" cy="190" r="2" />
    <circle cx="780" cy="140" r="2" />
    <circle cx="940" cy="200" r="2.5" filter="url(#cyanGlow)" />
    <circle cx="1040" cy="150" r="1.5" />
    <circle cx="200" cy="280" r="2" />
    <circle cx="1020" cy="300" r="2" />
  </g>

  <!-- Couple Silhouette on ground -->
  <g transform="translate(600, 526) scale(2.2)" fill="#FFFFFF">
    <!-- Boy standing -->
    <rect x="-8" y="-22" width="4" height="4" rx="1" />
    <rect x="-9" y="-18" width="6" height="10" />
    <rect x="-9" y="-8" width="2.5" height="8" />
    <rect x="-6" y="-8" width="2.5" height="8" />

    <!-- Girl standing close -->
    <rect x="3" y="-21" width="4" height="4" rx="1" fill="#FF88AA" />
    <rect x="2" y="-17" width="6" height="9" fill="#FF88AA" />
    <rect x="2.5" y="-8" width="2.2" height="8" fill="#FF88AA" />
    <rect x="5.3" y="-8" width="2.2" height="8" fill="#FF88AA" />

    <!-- Joined hands with little heart -->
    <rect x="-3" y="-13" width="5" height="2" fill="#00F0FF" />
    <rect x="-1" y="-16" width="2" height="2" fill="#FF2E63" />
  </g>
</svg>
